[package]
name = "hv-enabler"
version = "1.0.1"
edition = "2021"
description = "Manage Windows test signing and check hypervisor readiness"

[dependencies]
slint = "1"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
embed-manifest = "1"
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Keeps plain `cargo run` / `cargo build` (no --release) from producing huge
# debug-info files.
[profile.dev]
debug = false
